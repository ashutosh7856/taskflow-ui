<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f2f0e9" />
    <link rel="icon" type="image/png" href="/danto-favicon.png" />
    <link rel="apple-touch-icon" href="/assets/danto-mark.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="alternate" type="text/plain" title="LLM summary" href="/llms.txt" />
    <!--seo-start-->
    <title>Danto: Client portal & approvals for freelancers and agencies</title>
    <meta
      name="description"
      content="Give every client a live, branded portal. Clients see progress, approve work in one click and send requests, and AI writes your weekly status update. Free for your first client."
    />
    <meta property="og:title" content="Danto: Client portal & approvals for freelancers and agencies" />
    <meta property="og:description" content="A live, branded client portal with one-click approvals and AI status updates. Free for your first client." />
    <meta property="og:image" content="https://danto.app/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <!--seo-end-->
    <!--ssr-styles-->
    <noscript>
      <style>
        .animated-content { opacity: 1 !important; transform: none !important; filter: none !important; }
      </style>
    </noscript>
    <script>
      // One canonical address. Logins live in per-site storage, and payment
      // and email links return to danto.app, so www / pages.dev would look
      // logged out after checkout. Preview deploys (x.taskflow-ui-b5u…) stay.
      if (
        location.hostname === "www.danto.app" ||
        location.hostname === "taskflow-ui-b5u.pages.dev"
      )
        location.replace(
          "https://danto.app" +
            location.pathname +
            location.search +
            location.hash,
        );
    </script>
    <script>
      // Apply the saved/system colour scheme before React loads (no flash).
      // Public pages are light-only (see ForceLight).
      try {
        var app = /^\/(app|tasks|boards|billing|admin|workspaces)(\/|$)/.test(
          location.pathname,
        );
        var mode = app ? localStorage.getItem("mui-mode") || "system" : "light";
        if (mode === "system")
          mode = matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        document.documentElement.setAttribute("data-theme", mode);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"><!--ssr-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
