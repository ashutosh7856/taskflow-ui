name: Deploy Frontend to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: taskflow-ui-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write

    env:
      VITE_API_URL: ${{ vars.VITE_API_URL }}
      VITE_SUPPORT_EMAIL: ${{ vars.VITE_SUPPORT_EMAIL }}
      VITE_LEGAL_BUSINESS_NAME: ${{ vars.VITE_LEGAL_BUSINESS_NAME }}
      VITE_BUSINESS_ADDRESS: ${{ vars.VITE_BUSINESS_ADDRESS }}
      VITE_BUSINESS_PHONE: ${{ vars.VITE_BUSINESS_PHONE }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate production configuration
        run: test -n "$VITE_API_URL"

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=taskflow-ui-b5u --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
